<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Open the MAVIS mobile navigation prototype on your phone.">
    <title>MAVIS mobile navigation prototype</title>
    <link rel="stylesheet" href="cover.css">
  </head>
  <body>
    <main class="cover">
      <header class="brand" aria-label="Met Office MAVIS">
        <svg class="brand-mark" viewBox="0 0 36 24" aria-hidden="true">
          <path d="M2 6c7 2 10-4 18-2 5 1 8 0 14-2M2 11c7 2 10-4 18-2 5 1 8 0 14-2M2 16c7 2 10-4 18-2 5 1 8 0 14-2M2 21c7 2 10-4 18-2 5 1 8 0 14-2"/>
        </svg>
        <span class="brand-name">Met Office</span>
        <span class="product-name">MAVIS</span>
      </header>

      <section class="intro" aria-labelledby="cover-title">
        <h1 id="cover-title">Mobile navigation</h1>
        <p class="instruction">Scan the QR code with your phone camera to open the prototype.</p>
        <a class="prototype-link" href="https://uxsw.github.io/mmm-demos/nav-prototype/index.html">
          Open the prototype
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M11 6l4 4-4 4"/></svg>
        </a>
        <a class="destination" href="https://uxsw.github.io/mmm-demos/nav-prototype/index.html">uxsw.github.io/mmm-demos/nav-prototype/index.html</a>
      </section>

      <section class="qr-region" aria-label="Prototype QR code">
        <div class="qr-frame">
          <img src="prototype-qr.svg" width="420" height="420" alt="QR code linking to the MAVIS mobile navigation prototype">
        </div>
        <p>Open on your phone</p>
      </section>
    </main>
  </body>
</html>
