<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#061f2d" />
    <title>MAVIS drill-in navigation prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="prototype prototype--standalone">
      <section class="phone-stage" aria-label="Drill-in mobile navigation prototype">
        <div class="menu-overlay" id="menu-overlay">
          <header class="menu-header">
            <strong>Menu</strong>
            <button class="icon-button" id="close-menu" type="button" aria-label="Close menu">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </header>
          <div class="menu-body screen-menu-body" id="screen-container"></div>
          <footer class="menu-footer">© Crown copyright</footer>
        </div>
      </section>

    </main>
    <script src="nav-data.js"></script>
    <script src="screen.js"></script>
  </body>
</html>
